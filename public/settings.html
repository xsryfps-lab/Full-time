<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Full-Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<script src="/assets/app.js"></script>
<script>
injectShell("Settings", "Tune retrieval strictness, weight learning, and calibration");

const GROUPS = [
  {
    title: "Retrieval",
    fields: [
      { key: "retryThreshold", label: "Retry threshold", desc: "Below this completeness %, retrieval automatically retries with broader queries.", min: 40, max: 95, step: 5, suffix: "%" },
      { key: "rejectThreshold", label: "Reject threshold", desc: "If still below this after all retries, the analysis is refused outright.", min: 20, max: 90, step: 5, suffix: "%" },
      { key: "maxRetrievalAttempts", label: "Max retrieval attempts", desc: "How many times to retry a low-completeness retrieval.", min: 1, max: 5, step: 1, suffix: "" },
    ],
  },
  {
    title: "Weight Learning",
    fields: [
      { key: "weightStep", label: "Weight learning speed", desc: "How much a single graded market nudges a model's weight.", min: 0.005, max: 0.08, step: 0.005, suffix: "", decimal: true },
      { key: "minModelWeight", label: "Minimum model weight", desc: "Floor — no model's influence can drop below this.", min: 0.03, max: 0.45, step: 0.01, suffix: "", decimal: true },
      { key: "maxModelWeight", label: "Maximum model weight", desc: "Ceiling — no model can fully dominate the consensus.", min: 0.55, max: 0.97, step: 0.01, suffix: "", decimal: true },
      { key: "recencyHalfLifeDays", label: "Recency half-life (days)", desc: "Graded results this many days old count for half as much in weight learning. 0 disables recency decay.", min: 0, max: 180, step: 5, suffix: " days" },
    ],
  },
  {
    title: "Confidence Calibration",
    fields: [
      { key: "calibrationStrength", label: "Calibration strength", desc: "Multiplier on how strongly a model's Brier-score calibration affects its weight. 0 disables it.", min: 0, max: 3, step: 0.1, suffix: "×", decimal: true },
    ],
  },
  {
    title: "Reliability",
    fields: [
      { key: "modelTimeoutMs", label: "Per-model timeout (ms)", desc: "How long to wait for any single API call before treating it as failed.", min: 5000, max: 120000, step: 5000, suffix: " ms" },
      { key: "maxModelRetries", label: "Max retries per call", desc: "Retries (with exponential backoff) before excluding a model from this run.", min: 0, max: 4, step: 1, suffix: "" },
    ],
  },
];

const content = document.getElementById("pageContent");
content.innerHTML = `
  <div class="card animate-in" style="margin-bottom:20px; border-left:3px solid var(--gold);">
    <div class="text-sm muted" style="line-height:1.6;">
      <strong style="color:var(--gold);">Honest note:</strong> none of these settings can make retrieved data more complete
      than it actually is — Data Quality is a measurement, not a dial. What you're tuning here is the system's
      <em>tolerance</em>: how hard it tries, how strict it is, and how fast it reacts to new feedback.
    </div>
  </div>
  <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px;">
    <label class="toggle">
      <input type="checkbox" id="cacheEnabled">
      <span class="toggle-track"></span>
    </label>
    <div>
      <div style="font-weight:600; font-size:13.5px;">Enable result caching</div>
      <div class="text-sm faint">When on, identical fixtures return instantly with zero API calls unless force-refreshed.</div>
    </div>
  </div>
  <div id="groups"></div>
  <div style="display:flex; gap:10px; margin-top:20px;">
    <button class="btn primary" id="saveBtn">Save Settings</button>
    <button class="btn" id="resetBtn">Reset to Defaults</button>
  </div>
`;

let current = {};

async function load() {
  current = await api("/api/settings");
  document.getElementById("cacheEnabled").checked = current.cacheEnabled;
  document.getElementById("groups").innerHTML = GROUPS.map((g) => `
    <div class="section-title" style="margin-top:22px;">${g.title}</div>
    ${g.fields.map((f) => card(f)).join("")}
  `).join("");
  GROUPS.flatMap(g => g.fields).forEach((f) => {
    const range = document.getElementById(`range-${f.key}`);
    range.addEventListener("input", () => onSlide(f));
  });
}

function card(f) {
  const val = current[f.key];
  const display = f.decimal ? val : Math.round(val);
  return `
    <div class="card" style="margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between; align-items:baseline;">
        <strong style="font-family:var(--font-display); font-size:14px;">${f.label}</strong>
        <span class="mono gold" id="val-${f.key}" style="font-size:15px;">${display}${f.suffix}</span>
      </div>
      <div class="text-sm faint" style="margin:6px 0 12px;">${f.desc}</div>
      <input type="range" id="range-${f.key}" min="${f.min}" max="${f.max}" step="${f.step}" value="${val}">
    </div>
  `;
}

function onSlide(f) {
  const num = parseFloat(document.getElementById(`range-${f.key}`).value);
  current[f.key] = num;
  document.getElementById(`val-${f.key}`).textContent = (f.decimal ? num : Math.round(num)) + f.suffix;
}

document.getElementById("saveBtn").addEventListener("click", async () => {
  current.cacheEnabled = document.getElementById("cacheEnabled").checked;
  try {
    current = await api("/api/settings", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(current) });
    toast("Settings saved — takes effect on the next analysis", "success");
    load();
  } catch (err) {
    toast(err.message, "error");
  }
});

document.getElementById("resetBtn").addEventListener("click", async () => {
  current = await api("/api/settings/reset", { method: "POST" });
  toast("Reset to defaults", "success");
  load();
});

load();
</script>
</body>
</html>
