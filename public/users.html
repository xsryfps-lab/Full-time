<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users & Limits — Full-Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .limit-input { width: 90px; }
</style>
</head>
<body>
<script src="/assets/app.js"></script>
<script>
injectShell("Users & Limits", "Create accounts for friends and set daily analysis limits");

const content = document.getElementById("pageContent");
content.innerHTML = `
  <div class="card animate-in" style="margin-bottom:20px;">
    <div class="section-title" style="margin-top:0;">Create Account</div>
    <div class="grid grid-4">
      <div class="field" style="margin-bottom:0;"><label>Username</label><input type="text" id="newUsername" placeholder="e.g. sam"></div>
      <div class="field" style="margin-bottom:0;"><label>Password</label><input type="password" id="newPassword" placeholder="min. 6 characters"></div>
      <div class="field" style="margin-bottom:0;"><label>Role</label>
        <select id="newRole">
          <option value="friend">Friend</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="field" style="margin-bottom:0;"><label>Daily limit (blank = unlimited)</label><input type="number" id="newDailyLimit" min="0" placeholder="unlimited"></div>
    </div>
    <button class="btn primary" id="createBtn" style="margin-top:6px;">Create Account</button>
  </div>

  <div class="section-title">Accounts</div>
  <div class="card" id="usersCard"><div class="skeleton" style="height:160px;"></div></div>
`;

let users = [];

async function load() {
  try {
    const res = await api("/api/users");
    users = res.users;
    render();
  } catch (err) {
    document.getElementById("usersCard").innerHTML = `<div class="empty-state">Failed to load users: ${escapeHTML(err.message)}</div>`;
  }
}

function render() {
  const el = document.getElementById("usersCard");
  el.innerHTML = `
    <table>
      <thead><tr><th>Username</th><th>Role</th><th>Daily Limit</th><th>Used Today</th><th>Created</th><th></th></tr></thead>
      <tbody>
        ${users.map((u) => `
          <tr>
            <td><strong>${escapeHTML(u.username)}</strong></td>
            <td><span class="badge ${u.role === "admin" ? "gold" : ""}">${u.role}</span></td>
            <td><input type="number" class="limit-input" min="0" placeholder="unlimited" value="${u.dailyLimit ?? ""}" data-id="${u.id}" onchange="updateLimit(this)"></td>
            <td class="mono muted">${u.usageToday.limit === null ? u.usageToday.used : `${u.usageToday.used}/${u.usageToday.limit}`}</td>
            <td class="text-sm faint">${fmtDate(u.createdAt)}</td>
            <td style="display:flex; gap:6px; justify-content:flex-end;">
              <button class="btn sm" onclick="resetPw('${u.id}','${escapeHTML(u.username)}')">Reset Password</button>
              <button class="btn sm danger" onclick="removeUser('${u.id}','${escapeHTML(u.username)}')">Delete</button>
            </td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
}

document.getElementById("createBtn").addEventListener("click", async () => {
  const username = document.getElementById("newUsername").value.trim();
  const password = document.getElementById("newPassword").value;
  const role = document.getElementById("newRole").value;
  const rawLimit = document.getElementById("newDailyLimit").value.trim();
  const dailyLimit = rawLimit === "" ? null : Number(rawLimit);
  try {
    await api("/api/users", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ username, password, role, dailyLimit }) });
    toast(`Account "${username}" created`, "success");
    document.getElementById("newUsername").value = "";
    document.getElementById("newPassword").value = "";
    document.getElementById("newDailyLimit").value = "";
    load();
  } catch (err) {
    toast(err.message, "error");
  }
});

async function updateLimit(input) {
  const id = input.dataset.id;
  const raw = input.value.trim();
  const dailyLimit = raw === "" ? null : Number(raw);
  try {
    await api(`/api/users/${id}`, { method: "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify({ dailyLimit }) });
    toast("Daily limit updated", "success");
    load();
  } catch (err) {
    toast(err.message, "error");
    load();
  }
}

async function resetPw(id, username) {
  const newPassword = prompt(`New password for "${username}" (min. 6 characters):`);
  if (!newPassword) return;
  try {
    await api(`/api/users/${id}/reset-password`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ newPassword }) });
    toast(`Password reset for "${username}"`, "success");
  } catch (err) {
    toast(err.message, "error");
  }
}

async function removeUser(id, username) {
  if (!confirm(`Delete the account "${username}"? This cannot be undone.`)) return;
  try {
    await api(`/api/users/${id}`, { method: "DELETE" });
    toast(`Account "${username}" deleted`, "success");
    load();
  } catch (err) {
    toast(err.message, "error");
  }
}

load();
</script>
</body>
</html>
