<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Full-Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<script src="/assets/app.js"></script>
<script>
injectShell("Dashboard", "Overall system performance at a glance");

const content = document.getElementById("pageContent");
content.innerHTML = `
  <div class="grid grid-4 animate-in" id="statCards"></div>

  <div class="grid" style="grid-template-columns: 1.1fr 1.4fr; margin-top:16px;" id="heroRow"></div>

  <div class="section-title" style="margin-top:8px;">Model Rankings</div>
  <div class="card" id="rankingsCard"><div class="skeleton" style="height:180px;"></div></div>

  <div class="grid grid-2" style="margin-top:16px;">
    <div>
      <div class="section-title">Accuracy Over Time</div>
      <div class="card" id="accuracyChartCard"><div class="skeleton" style="height:220px;"></div></div>
    </div>
    <div>
      <div class="section-title">Confidence Calibration</div>
      <div class="card" id="calibrationChartCard"><div class="skeleton" style="height:220px;"></div></div>
    </div>
  </div>

  <div class="section-title" style="margin-top:16px;">Model Weighting Breakdown</div>
  <div class="card" id="weightingCard"><div class="skeleton" style="height:160px;"></div></div>

  <div class="section-title" style="margin-top:16px;">Weight Evolution Over Time</div>
  <div class="card" id="weightEvolutionCard"><div class="skeleton" style="height:220px;"></div></div>
`;

async function load() {
  let dash;
  try {
    dash = await api("/api/dashboard");
  } catch (err) {
    content.innerHTML = `<div class="empty-state">Couldn't load dashboard data: ${escapeHTML(err.message)}</div>`;
    return;
  }

  renderStatCards(dash);
  renderHeroRow(dash);
  renderRankings(dash);
  renderAccuracyChart(dash);
  renderCalibrationChart(dash);
  renderWeighting(dash);
  renderWeightEvolution(dash);
}

function renderStatCards(dash) {
  const hitTotal = dash.cacheStats.hits + dash.cacheStats.misses;
  const hitRate = hitTotal ? Math.round((dash.cacheStats.hits / hitTotal) * 100) + "%" : "—";
  const cards = [
    { label: "Total Predictions", value: dash.totals.total, color: "" },
    { label: "Graded", value: dash.totals.graded, color: "" },
    { label: "Pending Review", value: dash.totals.pending, color: "" },
    { label: "Cache Hit Rate", value: hitRate, color: "teal" },
  ];
  document.getElementById("statCards").innerHTML = cards.map((c) => `
    <div class="card stat-card">
      <div class="stat-label">${c.label}</div>
      <div class="stat-value ${c.color}">${c.value}</div>
    </div>
  `).join("");
}

function renderHeroRow(dash) {
  const row = document.getElementById("heroRow");
  row.innerHTML = `
    <div class="card" style="display:flex; flex-direction:column; align-items:center; justify-content:center;">
      <div class="eyebrow" style="margin-bottom:10px;">Overall Accuracy</div>
      <div id="overallDial"></div>
      <div class="text-sm muted" style="margin-top:8px;">Recent (last 10 graded): <strong class="mono">${fmtPct(dash.recentAccuracy)}</strong></div>
    </div>
    <div class="card">
      <div class="eyebrow" style="margin-bottom:14px;">Best &amp; Worst Performing Model</div>
      <div class="grid grid-2">
        ${bestWorstBlock("Top Model", dash.bestModel, "win")}
        ${bestWorstBlock("Needs Attention", dash.worstModel, "risk")}
      </div>
      <hr class="hr">
      <div class="kv-list">
        <div class="kv-row"><span class="k">Total graded predictions</span><span class="v">${dash.totals.graded}</span></div>
        <div class="kv-row"><span class="k">Models currently ranked</span><span class="v">${dash.modelRankings.length}</span></div>
      </div>
    </div>
  `;
  renderDial(document.getElementById("overallDial"), dash.overallAccuracy, { label: "ACCURACY" });
}

function bestWorstBlock(label, entry, tone) {
  if (!entry) return `<div class="text-sm faint">${label}<br>Not enough graded data yet.</div>`;
  return `
    <div>
      <div class="text-sm faint" style="margin-bottom:4px;">${label}</div>
      <div style="font-family:var(--font-display); font-size:18px;">${entry.name}</div>
      <span class="badge ${tone}" style="margin-top:6px;">${fmtPct(entry.stats.overallAccuracy)} accuracy</span>
    </div>
  `;
}

function renderRankings(dash) {
  const el = document.getElementById("rankingsCard");
  if (!dash.modelRankings.length) {
    el.innerHTML = `<div class="empty-state">No graded predictions yet — grade some results in History to populate model rankings.</div>`;
    return;
  }
  el.innerHTML = `
    <table>
      <thead><tr><th>#</th><th>Model</th><th>Overall</th><th>Last 10</th><th>Streak</th><th>Calibration</th><th>Trend</th><th>Graded</th></tr></thead>
      <tbody>
        ${dash.modelRankings.map((m, i) => `
          <tr class="row-hover" onclick="location.href='/models.html?model=${m.name.toLowerCase()}'">
            <td class="mono muted">${i + 1}</td>
            <td><strong>${m.name}</strong></td>
            <td>${fmtPct(m.stats.overallAccuracy, 1)}</td>
            <td>${fmtPct(m.stats.last10, 1)}</td>
            <td class="mono">${m.stats.currentStreak > 0 ? "🔥 " + m.stats.currentStreak : "—"}</td>
            <td>${fmtPct(m.stats.calibrationScore, 0)}</td>
            <td>${trendBadge(m.stats.trend)}</td>
            <td class="mono muted">${m.stats.gradedCount}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
}

function trendBadge(trend) {
  const map = {
    improving: `<span class="badge win">↑ improving</span>`,
    declining: `<span class="badge risk">↓ declining</span>`,
    stable: `<span class="badge">→ stable</span>`,
    insufficient_data: `<span class="badge faint">n/a</span>`,
  };
  return map[trend] || map.insufficient_data;
}

function renderAccuracyChart(dash) {
  const el = document.getElementById("accuracyChartCard");
  const points = dash.accuracyTimeline.map((d) => ({ value: d.accuracy }));
  renderLineChart(el, points, { color: "#e8b34d", yMin: 0, yMax: 100, formatY: (v) => Math.round(v) + "%" });
}

function renderCalibrationChart(dash) {
  const el = document.getElementById("calibrationChartCard");
  const bars = dash.calibrationBuckets.map((b) => ({ label: b.label, value: b.accuracy }));
  renderBarChart(el, bars, { color: "#34d1b6", yMax: 100 });
}

function renderWeighting(dash) {
  const el = document.getElementById("weightingCard");
  const rows = Object.values(dash.weightingExplained);
  el.innerHTML = `
    <div class="text-sm muted" style="margin-bottom:16px;">
      Each model's influence on the consensus = its learned base weight, nudged by recent accuracy and confidence calibration, then renormalized across every model present for a given fixture.
    </div>
    <div class="grid grid-auto">
      ${rows.map((r) => `
        <div class="card" style="background:var(--bg-elev-2);">
          <div style="display:flex; justify-content:space-between; align-items:baseline;">
            <strong style="font-family:var(--font-display);">${r.name}</strong>
            <span class="mono gold" style="font-size:18px;">${(r.finalWeight * 100).toFixed(1)}%</span>
          </div>
          <div class="progress-bar" style="margin:10px 0;"><div style="width:${r.finalWeight * 100}%"></div></div>
          <div class="kv-list">
            <div class="kv-row"><span class="k">Base weight</span><span class="v">${r.baseWeight}</span></div>
            <div class="kv-row"><span class="k">Recent-accuracy adj.</span><span class="v">${r.recentAccuracyAdj >= 0 ? "+" : ""}${r.recentAccuracyAdj}</span></div>
            <div class="kv-row"><span class="k">Calibration adj.</span><span class="v">${r.calibrationAdj >= 0 ? "+" : ""}${r.calibrationAdj}</span></div>
          </div>
        </div>
      `).join("")}
    </div>
  `;
}

function renderWeightEvolution(dash) {
  const el = document.getElementById("weightEvolutionCard");
  const history = dash.weightHistory || [];
  if (history.length < 2) {
    el.innerHTML = `<div class="empty-state text-sm">Weight history builds up as you grade more predictions — check back after a few.</div>`;
    return;
  }
  const names = Object.keys(history[0].weights);
  const colors = { Cohere: "#ef5b5b", Gemini: "#8b7ee8", Exa: "#f97316", Poisson: "#4ade80" };
  const width = 700, height = 240, padL = 34, padB = 22, padT = 10, padR = 10;
  const innerW = width - padL - padR, innerH = height - padT - padB;
  const stepX = innerW / (history.length - 1);
  const scaleY = (v) => padT + innerH - v * innerH; // weights are 0-1

  const gridLines = [0, 0.25, 0.5, 0.75, 1].map((f) => {
    const y = padT + innerH * (1 - f);
    return `<line x1="${padL}" y1="${y}" x2="${width - padR}" y2="${y}" stroke="var(--line)" stroke-width="1"/>
            <text x="4" y="${y + 3}" font-size="9" fill="var(--text-faint)" font-family="var(--font-mono)">${Math.round(f*100)}%</text>`;
  }).join("");

  const lines = names.map((name) => {
    const path = history.map((snap, i) => `${i === 0 ? "M" : "L"} ${padL + i * stepX} ${scaleY(snap.weights[name] ?? 0)}`).join(" ");
    return `<path d="${path}" fill="none" stroke="${colors[name] || '#888'}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join("");

  const legend = names.map((name) => `
    <span style="display:inline-flex; align-items:center; gap:6px; margin-right:16px; font-size:11.5px;">
      <span style="width:10px; height:10px; border-radius:50%; background:${colors[name]||'#888'}; display:inline-block;"></span>${name}
    </span>
  `).join("");

  el.innerHTML = `
    <div style="margin-bottom:10px;">${legend}</div>
    <svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" preserveAspectRatio="none">
      ${gridLines}${lines}
    </svg>
  `;
}

load();
</script>
</body>
</html>
